

syntax = "proto3";

package analytics;

option java_multiple_files = true;
option java_package = "io.grpc.analytics";
option java_outer_classname = "HelloWorldProto";

// The greeting service definition.
service ClustringAnalysis {
  // Sends a greeting
  rpc clustringKmeansServer (RequestClustringKmeans) returns (ResponseClustringKmeans) {}
}

// The request message containing the user's name.
message RequestClustringKmeans {
  string datasetPath = 1;
  string outputPath=2;
}
 
// The response message containing the greetings
message ResponseClustringKmeans {
string file_name = 1;
bytes file_content = 2;
string nodeName = 3;
}

service FrequentItems {
  rpc ftGrowth (RequestFrequentItems) returns (ResponseFrequentItems) {}
}

message RequestFrequentItems{
  string datasetPath = 1;
  string outputPath = 2;
}
 
// The response message containing the greetings
message ResponseFrequentItems {
string file_name = 1;
bytes file_content = 2;
}


service DatasetAccess {
  rpc remoteDataset (RequestDatasetAccess) returns (ResponseDatasetAccess) {}
} 

message RequestDatasetAccess{
  string folderPath = 1;
}
message FileData {
  string fileName = 1;  // Name of the file
  bytes content = 2;    // Content of the file
}


message ResponseDatasetAccess {
 repeated FileData files = 1; 
}

service RandomForest {
  rpc randomForestAnalytics (RequestRandomForest) returns (ResponseRandomForest) {}
} 

message RequestRandomForest{
  string datasetPath = 1;
  string datasetName = 2;
  string outputPath = 3;
}
 
// The response message containing the greetings 
message ResponseRandomForest {
bytes file_content = 1;
}

service LinearRegression {
  rpc linearRegressionAnalytics (RequestLinearRegression) returns (RequestLinearRegression) {}
} 

message RequestLinearRegression{
  string datasetPath = 1;
  string datasetName = 2;
  string outputPath = 3;
}
 
// The response message containing the greetings 
message ResponseLinearRegression {
bytes file_content = 1;
}